name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, host tests, ship image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the compiler, the thumbv8m target and the
      # rustfmt/clippy components, and rustup installs them on first use. The pin
      # is load-bearing (git-pinned embassy + a proc-macro-error2 future
      # incompatibility), so CI deliberately does not override it.
      - name: Show the pinned toolchain
        run: rustup show active-toolchain

      - name: Install just
        uses: taiki-e/install-action@just

      # fmt-check + firmware clippy (embedded target) + clippy on the standalone
      # hardware-free modules + their unit tests. This is the same gate the
      # README tells contributors to run before pushing.
      - name: just check
        run: just check

      # Build the ship image and report its size so a jump in flash usage shows up
      # in the log rather than at the bench.
      - name: just build
        run: just build

      - name: Report image size
        run: just size

      - name: Install picotool
        uses: ./.github/actions/setup-picotool

      # Produce the BOOTSEL image and assert its family ID in the log. The family
      # is what the RP2350 bootloader matches on; an image tagged for another chip
      # is refused at flash time, so catching that here is cheaper than finding it
      # on a board.
      - name: Build UF2
        run: |
          just uf2
          picotool info firmware/target/pico-numpad.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v7
        with:
          name: pico-numpad-uf2-${{ github.sha }}
          path: firmware/target/pico-numpad.uf2
          if-no-files-found: error
          retention-days: 30
