name: Pages

# Deploys the WebUSB key/LED editor to GitHub Pages so the firmware's landing URL
# points at something that is actually always up, instead of a localhost server
# that is usually not running.
#
# This works because WebUSB requires a secure context, and Pages serves HTTPS.
# `http://localhost` also qualifies, which is why local development works too.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# `pages: write` is what actually publishes the site; `id-token: write` is what
# lets the deploy action authenticate against GitHub. Without both, deploy fails
# with a permission error that does not point at which one is missing.
permissions:
  contents: read
  pages: write
  id-token: write

# Two deploys racing on the same site is how you get a half-published editor.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The editor is one self-contained HTML file: no build step, no external
      # assets, no dependency install. The artifact is just the directory.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
