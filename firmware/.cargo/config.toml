[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Slot changes reboot the MCU on purpose; don't halt the CPU on those resets.
runner = "probe-rs run --chip RP235x --no-catch-reset"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
# Bare `cargo` gets full tracing; `just build`/`just ship` override with LOG_SHIP.
DEFMT_LOG = "debug"
