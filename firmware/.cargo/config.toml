[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Flash over SWD with probe-rs (user choice).
# Slot changes intentionally reboot; do not halt the CPU on those resets.
runner = "probe-rs run --chip RP235x --no-catch-reset"
# Alternative: picotool load -u -v -x -t elf

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "debug"
