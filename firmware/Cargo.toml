[package]
name = "pico-numpad"
version = "0.3.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
# Patched below: the embassy crates pull it by path, so crates.io here would double-link it.
embassy-futures = "0.1"
embassy-usb = { version = "0.6", features = ["defmt"] }
embedded-storage-async = "0.4"

cyw43 = { version = "0.7", features = ["defmt", "firmware-logs", "bluetooth"] }
cyw43-pio = { version = "0.10", features = ["defmt"] }
trouble-host = { version = "0.8", features = ["default-packet-pool-mtu-128", "defmt", "security", "serde"] }

serde = { version = "1", default-features = false, features = ["derive"] }
sequential-storage = { version = "8", default-features = false, features = ["postcard"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = "0.7"
cortex-m-rt = "0.7"
static_cell = "2"
# No `critical-section` feature: embassy-rp already provides the impl.
portable-atomic = "1.5"

[profile.release]
debug = 2
# Measured at DEFMT_LOG=info: fat -6.0%, thin -4.6% of text+data vs the old
# non-LTO default. `panic = "abort"` was worth 4 bytes and was not taken.
lto = "fat"
codegen-units = 1

# Bench build: no LTO so probe-rs still reports real frames, and its own target
# dir so flipping DEFMT_LOG does not rebuild the tree. The justfile sets the level,
# which is the only way to scope it to a profile.
[profile.diagnostic]
inherits = "release"
lto = false
codegen-units = 16

# Align cyw43 + embassy with the bt-hci-transport 0.1 model trouble-host 0.8 expects.
# Bump every rev in one commit: the rev is authoritative and the `version` fields
# above are only constraints, so a mixed-rev set fails resolution pointing at
# [dependencies] rather than here.
[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }

# Cast-lint exceptions are scoped to the modules that need them. `forbid` (not
# `deny`) so any future unsafe forces a visible edit here rather than a local
# allow; the justfile mirrors it with `-F unsafe_code` for the standalone lint.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
