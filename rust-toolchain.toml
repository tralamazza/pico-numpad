# The compiler is part of the pin: the firmware builds against a git rev of embassy
# (firmware/Cargo.toml [patch.crates-io]). This channel is also what contains the
# `proc-macro-error2 2.0.1` future-incompat (E0365, via pio-proc <- pio <-
# embassy-rp), which has no upstream fix -- bump deliberately.
[toolchain]
channel = "1.98.1"
targets = ["thumbv8m.main-none-eabihf"]
components = ["rustfmt", "clippy"]
